# Stáhne rozpis zápasů (klouzavé okno 21 dní dopředu) pro každou
# competition s vyplněným scrape_source/scrape_path a zapíše ho do
# `matches`. Než se cokoliv zapíše, data projdou kontrolou rozumnosti
# (scripts/sync/lib/validate-fixtures.mjs) — když neprojdou (web třeba
# změnil layout), nic se nezapíše a založí/aktualizuje se GitHub Issue
# místo tichého zapsání špatných dat.
#
# Spouštění zajišťuje výhradně externí cron-job.org (volá GitHubovo API
# `POST .../workflows/sync-fixtures.yml/dispatches` 1×/den brzy ráno
# pražského času) -- GitHubův vlastní `schedule:` trigger byl 6.9.2026
# po ověření cron-job.org úlohy odstraněn, ať appka nemá dvě souběžné
# (a navzájem si konkurující) cesty ke spuštění stejné věci; stejný
# důvod jako u sync-results.yml. `workflow_dispatch` zůstává pro ruční
# spuštění/ladění a je to zároveň přesně to, co cron-job.org volá.

name: Sync fixtures

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      # Playwright sám přeskočí stažení Chromia, když už v tomhle adresáři
      # existuje (kešuje se podle verze z package-lock.json) — jediné, co
      # se pak pokaždé udělá znovu, je rychlá kontrola systémových balíčků
      # (--with-deps). Bez týhle cache se ~300 MB Chromia stahovalo úplně
      # od začátku při každém jednom běhu.
      - name: Cache Chromia pro Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/sync/package-lock.json') }}

      - name: Nainstalovat závislosti a Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Spustit sync-fixtures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node fixtures.mjs
