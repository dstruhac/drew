# Dohledá výsledky u zápasů, kterým už uplynul výkop, ale v databázi
# ještě nemají status='finished' — a pokud pro danou competition v
# databázi zatím není vůbec žádný zápas (nová soutěž přidaná uprostřed
# sezóny), zkusí zápasy i s výsledkem rovnou zpětně dotáhnout. Než
# cokoliv scrapne, zeptá se vlastní databáze (scripts/sync/results.mjs)
# — pokud ani jedno z výše uvedeného neplatí, přeskočí competition bez
# otevření prohlížeče.
#
# Běží automaticky každých 30 minut, celý den (ne jen večer). Původní
# návrh v docs/IMPORT-ARCHITECTURE.md počítal s večerním oknem — to
# dávalo smysl u placeného API, kde se šetřily požadavky. Tady žádný
# důvod okno omezovat není: scraping nic nestojí (veřejné repo →
# GitHub Actions minuty zdarma) a `results.mjs` se stejně nejdřív zeptá
# vlastní databáze zdarma, takže běh mimo zápasové hodiny skončí za
# pár vteřin bez otevření prohlížeče. Běh po celý den navíc řeší i
# víkendové odpolední zápasy a zápasy končící po půlnoci, aniž by se
# musel cron ručně přeposouvat kvůli letnímu/zimnímu času (GitHub
# Actions cron běží vždy v UTC, ne v pražském čase).
#
# Spouštění zajišťuje výhradně externí cron-job.org (volá GitHubovo API
# `POST .../workflows/sync-results.yml/dispatches` každých 30 minut) --
# GitHubův vlastní `schedule:` trigger byl dřív zapnutý souběžně jako
# záloha, ale ukázal se jako nespolehlivý (naměřeno 3,5-11 h mezi
# jednotlivými scheduled běhy místo 30 minut, zdokumentovaný,
# celoplošný problém napříč GitHubem -- Community Discussions #147369,
# #156282), takže byl 6.9.2026 po ověření cron-job.org úlohy odstraněn
# místo dalšího ladění. `workflow_dispatch` zůstává pro ruční
# spuštění/ladění a je to zároveň přesně to, co cron-job.org volá.

name: Sync results

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      # Playwright sám přeskočí stažení Chromia, když už v tomhle adresáři
      # existuje (kešuje se podle verze z package-lock.json) — jediné, co
      # se pak pokaždé udělá znovu, je rychlá kontrola systémových balíčků
      # (--with-deps). Bez týhle cache se ~300 MB Chromia stahovalo úplně
      # od začátku při každém jednom běhu.
      - name: Cache Chromia pro Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/sync/package-lock.json') }}

      - name: Nainstalovat závislosti a Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Spustit sync-results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node results.mjs
