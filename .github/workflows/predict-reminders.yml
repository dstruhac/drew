# Pošle e-mailem upozornění hráčům, kterým chybí tip na dnešní zápas --
# 2 hodiny před PRVNÍM chybějícím zápasem dne, jeden souhrnný e-mail za
# den i při víc chybějících tipech napříč soutěžemi (odsouhlaseno
# s uživatelem 28.8.2026). Viz scripts/sync/predict-reminders.mjs.
#
# Na rozdíl od sync-fixtures/sync-results tenhle skript nepotřebuje
# Playwright/prohlížeč -- jen čte/zapisuje Supabase a posílá e-mail
# přes Gmail SMTP.
#
# Hodinový schedule zapnut 28.8.2026 po ověřeném ručním běhu (proběhl
# bez chyby, jen nikomu nic neposlal -- nikdo zatím neměl zapnuté
# upozornění a žádný zápas nebyl v okně). Živé odeslání přes Gmail se
# tak zatím neprokázalo, ale skript má vlastní hlášení chyb
# (reportFailure založí GitHub issue, pokud odeslání selže) -- čekání
# na první reálný zápas by nic nezískalo, jen oddálilo start.
#
# Poběží po hodině -- přesný čas prvního chybějícího zápasu se liší
# hráč od hráče i den ode dne, hodinová granularita cronu stačí (pošle
# se nejdřív přesně za 2h před kickoffem, nejpozději do hodiny poté).
#
# Minuta 12 (ne 0) -- odsouhlaseno 29.8.2026 při ladění spolehlivosti
# scheduled běhů (viz sync-results.yml): GitHub Actions sám doporučuje
# neplánovat úlohy přesně na celou hodinu, protože to je nejvytíženější
# okamžik pro spouštění naplánovaných workflow napříč celým GitHubem --
# tenhle cron se navíc přesně na :00 srážel i s vlastním sync-results.

name: Predict reminders

on:
  workflow_dispatch: {}
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      - name: Nainstalovat závislosti
        run: npm install

      - name: Spustit predict-reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_BASE_URL: https://klopi.cz
        run: node predict-reminders.mjs
