# Pošle e-mailem upozornění hráčům, kterým chybí tip na dnešní zápas --
# 2 hodiny před PRVNÍM chybějícím zápasem dne, jeden souhrnný e-mail za
# den i při víc chybějících tipech napříč soutěžemi (odsouhlaseno
# s uživatelem 28.8.2026). Viz scripts/sync/predict-reminders.mjs.
#
# Na rozdíl od sync-fixtures/sync-results tenhle skript nepotřebuje
# Playwright/prohlížeč -- jen čte/zapisuje Supabase a posílá e-mail
# přes Gmail SMTP.
#
# Spouštění zajišťuje výhradně externí cron-job.org (volá GitHubovo API
# `POST .../workflows/predict-reminders.yml/dispatches` každou hodinu).
# Přesný čas prvního chybějícího zápasu se liší hráč od hráče i den ode
# dne, hodinová granularita stačí (pošle se nejdřív přesně za 2h před
# kickoffem, nejpozději do hodiny poté). GitHubův vlastní `schedule:`
# trigger byl 6.9.2026 po ověření cron-job.org úlohy odstraněn, stejný
# důvod jako u sync-results.yml. `workflow_dispatch` zůstává pro ruční
# spuštění/ladění a je to zároveň přesně to, co cron-job.org volá.

name: Predict reminders

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      - name: Nainstalovat závislosti
        run: npm install

      - name: Spustit predict-reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_BASE_URL: https://klopi.cz
        run: node predict-reminders.mjs
