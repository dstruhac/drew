# Pošle e-mailem upozornění hráčům, kterým chybí tip na dnešní zápas --
# 2 hodiny před PRVNÍM chybějícím zápasem dne, jeden souhrnný e-mail za
# den i při víc chybějících tipech napříč soutěžemi (odsouhlaseno
# s uživatelem 28.8.2026). Viz scripts/sync/predict-reminders.mjs.
#
# Na rozdíl od sync-fixtures/sync-results tenhle skript nepotřebuje
# Playwright/prohlížeč -- jen čte/zapisuje Supabase a posílá e-mail
# přes Gmail SMTP.
#
# Zatím jen ruční spuštění (workflow_dispatch) -- stejná opatrná
# konvence jako dřív u sync-fixtures/sync-results: hodinový `schedule`
# (viz PROJECT.md) se přidá až PO tom, co uživatel nastaví
# GMAIL_USER/GMAIL_APP_PASSWORD jako GitHub secrets a proběhne aspoň
# jeden úspěšný ruční běh s reálným odesláním.
#
# Až se schedule přidá, poběží po hodině -- přesný čas prvního
# chybějícího zápasu se liší hráč od hráče i den ode dne, hodinová
# granularita cronu stačí (pošle se nejdřív přesně za 2h před
# kickoffem, nejpozději do hodiny poté).

name: Predict reminders

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      - name: Nainstalovat závislosti
        run: npm install

      - name: Spustit predict-reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node predict-reminders.mjs
