# Jednorázový (ruční) import log soutěže + klubů Chance Ligy z lfafotbal.cz
# do Supabase Storage + tabulek competitions.logo_url / team_logos.
# Viz scripts/sync/import-logos.mjs pro zdroje a mapování zkratka -> tým.
#
# Na rozdíl od sync-fixtures/sync-results nemá tenhle workflow schedule --
# loga se nemění denně, spouští se ručně, když je potřeba je (znovu)
# naimportovat.

name: Import logos

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      # unzip bývá na ubuntu-latest už předinstalovaný, poppler-utils
      # (pdftoppm, rasterizace PDF vektoru) a imagemagick (convert, ořez
      # bílého okraje) obvykle taky, ale instalujeme explicitně, ať na
      # tom běh nezávisí na tom, co je zrovna na image runneru.
      - name: Nainstalovat systémové nástroje (unzip, poppler-utils, imagemagick)
        run: sudo apt-get update && sudo apt-get install -y unzip poppler-utils imagemagick

      - name: Nainstalovat závislosti
        run: npm install

      - name: Spustit import-logos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node import-logos.mjs
