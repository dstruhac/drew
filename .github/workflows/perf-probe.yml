# Pomocný workflow: změří reálné odezvy produkční appky a Supabase.
#
# Proč existuje: Claude Code session běží v sandboxu bez přístupu na
# *.supabase.co i na vercel.app (viz CLAUDE.md, sekce "Síťové omezení"),
# takže odsud nejde změřit, jak dlouho co trvá. GitHub Actions běží
# s plným internetem.
#
# Zjišťuje hlavně DVĚ věci, na kterých stojí analýza pomalé odezvy:
#   1. v jakém REGIONU běží Vercel funkce (hlavička x-vercel-id) a kde
#      leží Supabase (IP -> AWS region) -- když jsou daleko od sebe,
#      každý dotaz do databáze platí desítky ms navíc, a appka jich
#      dělá na jedno načtení stránky několik za sebou
#   2. kolik stojí jedno ověření přihlášení (/auth/v1/user) a jeden
#      obyčejný dotaz do databáze (/rest/v1/...)
#
# Jen čte (GET), nikam nezapisuje. Spouští se ručně (workflow_dispatch).
#
# POZOR (poučení z 28.8.2026): každý krok musí mít TVRDÝ timeout.
# První verze používala `whois` (visí bez odpovědi na runneru) a dlouhé
# `--max-time 30` u pěti opakování tří měření -- běh se dvakrát zasekl
# a musel se ručně rušit. Proto: `timeout` kolem všeho, krátké limity
# a `timeout-minutes` na jobu jako pojistka.

name: Perf probe

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL produkční appky"
        required: false
        default: "https://klopi.cz"
        type: string
      repeats:
        description: "Kolik měření udělat po sobě (první bývá pomalejší kvůli studenému startu)"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Změřit odezvy
        timeout-minutes: 4
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: ${{ inputs.app_url }}
          REPEATS: ${{ inputs.repeats }}
        run: |
          set -uo pipefail

          FMT='dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total} http=%{http_code}\n'

          # Každé volání má krátký limit a je navíc obalené `timeout`,
          # aby nic nemohlo zaseknout celý běh (viz poznámka nahoře).
          measure() {
            timeout 15 curl -sS -o /dev/null --max-time 10 -w "${FMT}" "$@" || echo "(timeout/chyba)"
          }

          echo "=== 1. REGION VERCELU (x-vercel-id) ==="
          # POZOR (poučení z 28.8.2026): NESMÍ se měřit na /login.
          # /login je staticky předgenerovaná stránka, kterou vrací
          # nejbližší CDN uzel -- x-vercel-id pak ukazuje jen ten uzel
          # (mění se podle toho, odkud se ptáme: iad1, cle1, sfo1...),
          # NE region, ve kterém běží serverové funkce. Na tom se dá
          # snadno postavit špatný závěr (a stalo se).
          #
          # /auth/callback je naopak skutečná funkce (v build outputu
          # označená "ƒ"). Bez parametru `code` jen přesměruje na /login,
          # takže volání nic nemění. U funkce má x-vercel-id DVĚ části
          # oddělené "::" -- první je CDN uzel, druhá region funkce,
          # tedy to, co nás zajímá (má být dub1 = Dublin = eu-west-1,
          # stejné místo jako databáze).
          echo "(měřeno na /auth/callback -- skutečná funkce, ne statická stránka)"
          timeout 20 curl -sS -o /dev/null -D h.txt --max-time 15 "${APP_URL}/auth/callback" || true
          grep -iE '^(x-vercel-id|x-matched-path|server)' h.txt || echo "(hlavičky nenalezeny)"
          echo "--- pro srovnání statická /login (ukazuje jen CDN uzel) ---"
          timeout 20 curl -sS -o /dev/null -D h2.txt --max-time 15 "${APP_URL}/login" || true
          grep -iE '^x-vercel-id' h2.txt || true

          echo
          echo "=== 2. REGION SUPABASE (IP -> AWS region) ==="
          SUPA_HOST=$(echo "${SUPABASE_URL}" | sed -E 's#^https?://##; s#/.*##')
          # REST/Auth hostname schovává Supabase za Cloudflare, takže jeho
          # IP region neprozradí. Přímý databázový hostname (db.<ref>...)
          # ale míří rovnou na AWS -- z něj region zjistíme.
          DB_HOST="db.${SUPA_HOST}"
          # POZOR: `|| true` je nutné -- krok běží pod `bash -e` a getent
          # vrací nenulový kód, když hostname neexistuje (db.* už novější
          # Supabase projekty nemají). Bez toho spadne celý běh.
          # Hostname obsahuje ID projektu, do logu ho nedáváme.
          SUPA_IP=$( (timeout 10 getent ahostsv4 "${DB_HOST}" || true) | head -1 | awk '{print $1}')
          if [ -z "${SUPA_IP}" ]; then
            echo "(db.* hostname neexistuje, zkouším REST hostname)"
            SUPA_IP=$( (timeout 10 getent ahostsv4 "${SUPA_HOST}" || true) | head -1 | awk '{print $1}')
          fi
          echo "IP: ${SUPA_IP:-(nezjištěno)}"

          # Region bývá i v hlavičkách odpovědi (Supabase/Fly/Cloudflare
          # je tam někdy posílají) -- vypíšeme je všechny, ať se dá region
          # určit i když IP patří Cloudflare.
          echo "--- hlavičky odpovědi Supabase ---"
          timeout 15 curl -sS -o /dev/null -D sh.txt --max-time 10 \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/matches?select=id&limit=1" || true
          # apikey/token se v hlavičkách odpovědi nevrací, ale pro jistotu
          # filtrujeme jen na neutrální informační hlavičky.
          grep -iE '^(cf-ray|x-sb|sb-|server|via|x-served|fly-|x-region|report-to)' sh.txt \
            | cut -c1-200 || echo "(žádné hlavičky s regionem)"
          if [ -n "${SUPA_IP}" ] && timeout 25 curl -sS --max-time 20 -o aws.json \
               https://ip-ranges.amazonaws.com/ip-ranges.json; then
            # Jednořádkový Python schválně: víceřádkový skript zarovnaný
            # na začátek řádku rozbije YAML blok `run: |` (ověřeno).
            timeout 30 python3 -c "import ipaddress,json,sys; ip=ipaddress.ip_address(sys.argv[1]); m=sorted([(ipaddress.ip_network(p['ip_prefix']),p) for p in json.load(open('aws.json'))['prefixes'] if ip in ipaddress.ip_network(p['ip_prefix'])], key=lambda x: -x[0].prefixlen); print('AWS region:', m[0][1]['region'] if m else 'IP mimo AWS rozsahy')" "${SUPA_IP}" \
              || echo "(region se nepodařilo určit)"
          fi

          echo
          echo "=== 3. OVĚŘENÍ PŘIHLÁŠENÍ (/auth/v1/user) ==="
          echo "    appka tohle volá v proxy.ts na KAŽDÝ požadavek"
          for i in $(seq 1 "${REPEATS}"); do
            printf 'pokus %s: ' "$i"
            measure -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                    -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                    "${SUPABASE_URL}/auth/v1/user"
          done

          echo
          echo "=== 4. BĚŽNÝ DOTAZ DO DATABÁZE (/rest/v1/matches) ==="
          for i in $(seq 1 "${REPEATS}"); do
            printf 'pokus %s: ' "$i"
            measure -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                    -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
                    "${SUPABASE_URL}/rest/v1/matches?select=id,home_team,away_team&limit=50"
          done

          echo
          echo "=== 5. ODEZVA PRODUKČNÍ APPKY (/login) ==="
          for i in $(seq 1 "${REPEATS}"); do
            printf 'pokus %s: ' "$i"
            measure "${APP_URL}/login"
          done

          echo
          echo "----- Konec měření -----"
