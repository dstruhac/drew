# Jednou denně večer vybere 5 náhodných zápasů ZÍTŘEJŠÍHO dne napříč
# skupinou známých fotbalových a hokejových lig (viz
# scripts/sync/lib/random-league-pool.mjs) a zapíše je do trvalé
# soutěže "Náhodná liga". Detaily a odůvodnění viz PROJECT.md.
#
# 16:00 UTC = 18:00 pražského času v létě (CEST, UTC+2) -- v zimě (CET,
# UTC+1) tím pádem vyjde na 17:00 pražského času, o hodinu dřív, než je
# zadání "18:00" (6.9.2026, na žádost uživatele -- appka běžela ráno a
# vybírala zápasy TÉHOŽ dne, takže na ně nešlo tipovat dopředu).
# GitHub Actions cron neumí časové pásmo, jen UTC, takže se sám podle
# letního/zimního času nepřeladí -- 16:00 UTC vědomě zvoleno tak, aby
# seděl přesně v aktuálně platném letním čase a v zimě byl jen o
# hodinu dřív (ne později), což pro "tipuj dopředu" nevadí.
name: Random league

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: read
  issues: write

jobs:
  pick:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      - name: Cache Chromia pro Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/sync/package-lock.json') }}

      - name: Nainstalovat závislosti a Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Spustit random-league
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node random-league.mjs
