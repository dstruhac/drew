# Jednou denně večer vybere 5 náhodných zápasů ZÍTŘEJŠÍHO dne napříč
# skupinou známých fotbalových a hokejových lig (viz
# scripts/sync/lib/random-league-pool.mjs) a zapíše je do trvalé
# soutěže "Náhodná liga". Detaily a odůvodnění viz PROJECT.md.
#
# Spouštění zajišťuje výhradně externí cron-job.org (volá GitHubovo API
# `POST .../workflows/random-league.yml/dispatches` denně v 18:00
# pražského času -- cron-job.org umí časové pásmo přímo, takže si samo
# poradí s letním/zimním časem, na rozdíl od GitHubova vlastního
# `schedule:`, který zná jen UTC). Ten byl 6.9.2026 po ověření
# cron-job.org úlohy odstraněn, stejný důvod jako u sync-results.yml.
# `workflow_dispatch` zůstává pro ruční spuštění/ladění a je to zároveň
# přesně to, co cron-job.org volá.
name: Random league

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  pick:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      - name: Cache Chromia pro Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/sync/package-lock.json') }}

      - name: Nainstalovat závislosti a Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Spustit random-league
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node random-league.mjs
