# Pomocný workflow: zavolá zadané sportovní API a vypíše odpověď do logu.
#
# Proč existuje: Claude Code session běží v sandboxu, který blokuje
# odchozí přístup na sportovní API (403 na CONNECT). GitHub Actions ale
# běží s plným internetem a Claude si umí přečíst log doběhlého běhu
# zpátky přes GitHub API. Tohle je tedy jediná cesta, jak si z chatu
# ověřit, co konkrétní API reálně vrací, bez ručního kopírování.
#
# Spouští se jen ručně (workflow_dispatch) — nic neběží samo od sebe
# a workflow nikam nezapisuje, jen čte.
#
# POZOR: aby šel workflow spustit, musí být tenhle soubor už
# smergovaný v `main` (GitHub jinak workflow_dispatch nenabídne).

name: API probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Plná URL API endpointu, včetně parametrů"
        required: true
        type: string
      header_name:
        description: "Název hlavičky s API klíčem"
        required: false
        default: "x-apisports-key"
        type: string
      max_chars:
        description: "Kolik znaků odpovědi maximálně vypsat do logu"
        required: false
        default: "40000"
        type: string
      filter:
        description: "Nepovinný regulární výraz — vypíše jen řádky, které mu odpovídají (užitečné u velkých odpovědí a HTML stránek)"
        required: false
        default: ""
        type: string
      jq:
        description: "Nepovinný jq výraz — vypíše jen vybranou část JSON odpovědi (např. '.response[] | .league.name')"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Zavolat API a vypsat odpověď
        env:
          # Hodnota se do logu nikdy nevypíše — GitHub secrets v logu
          # automaticky maskuje. Pokud secret není nastavený, zavolá se
          # API bez hlavičky a odpověď (nejspíš chyba) to ukáže.
          API_KEY: ${{ secrets.API_SPORTS_KEY }}
          PROBE_URL: ${{ inputs.url }}
          HEADER_NAME: ${{ inputs.header_name }}
          MAX_CHARS: ${{ inputs.max_chars }}
          FILTER: ${{ inputs.filter }}
          JQ_EXPR: ${{ inputs.jq }}
        run: |
          set -uo pipefail

          if [ -z "${API_KEY}" ]; then
            echo "::warning::Secret API_SPORTS_KEY není nastavený — volám bez autorizační hlavičky."
            AUTH_ARGS=()
          else
            AUTH_ARGS=(-H "${HEADER_NAME}: ${API_KEY}")
          fi

          echo "URL: ${PROBE_URL}"
          echo "Hlavička s klíčem: ${HEADER_NAME}"
          echo "----- HTTP status a hlavičky -----"

          HTTP_CODE=$(curl -sS --max-time 30 \
            "${AUTH_ARGS[@]}" \
            -D headers.txt \
            -o body.json \
            -w '%{http_code}' \
            "${PROBE_URL}") || {
              echo "::error::curl selhal (viz výstup výše)"
              exit 1
            }

          echo "HTTP kód: ${HTTP_CODE}"
          # Hlavičky s limity requestů jsou to hlavní, co nás zajímá.
          grep -iE '^(x-ratelimit|ratelimit|content-type|retry-after)' headers.txt || true

          echo "----- Velikost odpovědi -----"
          wc -c < body.json

          # Když je zadaný filtr, vypíše se jen to, co mu odpovídá. Hodí se
          # na velké odpovědi a na HTML stránky, kde nás zajímá jen zmínka
          # o konkrétní lize. `grep` vrací 1, když nic nenajde — to ale
          # není chyba běhu, proto `|| true` (krok běží pod `bash -e`).
          if [ -n "${FILTER}" ]; then
            echo "----- Řádky odpovídající filtru: ${FILTER} -----"
            grep -inE "${FILTER}" body.json > matches.txt || true
            MATCH_COUNT=$(wc -l < matches.txt)
            echo "Počet odpovídajících řádků: ${MATCH_COUNT}"
            head -c "${MAX_CHARS}" matches.txt
            echo
            echo "----- Konec filtru -----"
          fi

          # POZOR: nikdy sem nedávej `jq ... | head -c`. `head` po dosažení
          # limitu zavře rouru, `jq` dostane SIGPIPE a kvůli `pipefail`
          # spadne celý krok (stalo se, exit code 2). Proto se nejdřív
          # zapíše do souboru a teprve ten se ořízne.
          if jq -e . body.json >/dev/null 2>&1; then
            jq . body.json > pretty.json

            # Počet položek v poli — hlavní údaj, když se ověřuje, jestli
            # API vrací celý seznam, nebo jen ořezaný vzorek.
            echo "----- Počty -----"
            jq -r '
              if type == "object" then
                to_entries
                | map(select(.value | type == "array")
                      | "\(.key): \(.value | length) položek")
                | if length > 0 then .[] else "(žádné pole v odpovědi)" end
              else
                "(kořen odpovědi není objekt)"
              end
            ' body.json || echo "(počty se nepodařilo spočítat)"

            # Cílený výběr z odpovědi. U velkých odpovědí (seznamy lig se
            # všemi sezónami) je tohle jediný způsob, jak se dostat k tomu
            # podstatnému, aniž by to utopil zbytek. Chybný výraz nemá
            # shodit celý běh, proto `|| echo`.
            if [ -n "${JQ_EXPR}" ]; then
              echo "----- Výběr přes jq: ${JQ_EXPR} -----"
              jq -r "${JQ_EXPR}" body.json > selected.txt 2>jq_err.txt \
                || { echo "(jq výraz selhal:)"; cat jq_err.txt; }
              head -c "${MAX_CHARS}" selected.txt
              # Bez tohohle upozornění vypadá oříznutý výběr jako úplný
              # seznam — a dá se z něj vyvodit pravý opak pravdy. Stalo
              # se: při max_chars=150 zmizela hledaná liga z výpisu a
              # závěr byl "tuhle ligu nemají", což byla nepravda.
              SEL_TOTAL=$(wc -c < selected.txt)
              if [ "${SEL_TOTAL}" -gt "${MAX_CHARS}" ]; then
                echo
                echo "::warning::VÝBĚR JE OŘÍZNUTÝ (${SEL_TOTAL} znaků, zobrazeno ${MAX_CHARS}) — nedělej závěry z neúplného seznamu, zvyš max_chars!"
              fi
              echo
              echo "----- Konec výběru -----"
            fi

            TOTAL=$(wc -c < pretty.json)
            echo "----- Tělo odpovědi (celkem ${TOTAL} znaků, vypisuji max ${MAX_CHARS}) -----"
            head -c "${MAX_CHARS}" pretty.json
            if [ "${TOTAL}" -gt "${MAX_CHARS}" ]; then
              echo
              echo "…(zkráceno — zvyš max_chars, pokud potřebuješ zbytek)"
            fi
          else
            echo "----- Tělo odpovědi (není platný JSON, vypisuji syrově) -----"
            head -c "${MAX_CHARS}" body.json
          fi
          echo
          echo "----- Konec odpovědi -----"
