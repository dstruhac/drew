# Jednorázový (ruční) import log soutěže + klubů Premier League z
# football-logos.cc do Supabase Storage + tabulek competitions.logo_url
# / team_logos. Viz scripts/sync/import-logos-football-logos-cc.mjs pro
# zdroj a mapování team_name -> slug.
#
# Na rozdíl od import-logos.yml (Chance Liga, lfafotbal.cz) nepotřebuje
# unzip/poppler-utils/imagemagick -- football-logos.cc dává rovnou
# hotové transparentní PNG.
#
# Nemá schedule -- loga se nemění denně, spouští se ručně, když je
# potřeba je (znovu) naimportovat.

name: Import logos (Premier League)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/sync/package-lock.json

      - name: Nainstalovat závislosti
        run: npm install

      - name: Spustit import-logos-football-logos-cc
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node import-logos-football-logos-cc.mjs
