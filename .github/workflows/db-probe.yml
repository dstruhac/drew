# Pomocný workflow: přečte data z appčiny Supabase databáze přes REST API
# a vypíše je do logu. Obdoba api-probe.yml, ale autentizovaně vůči naší
# vlastní databázi (service role klíč obchází RLS, čte tedy úplně
# všechno) -- na rozdíl od api-probe.yml, který je pro cizí/veřejná API.
#
# Proč existuje: Claude Code session běží v sandboxu bez přístupu na
# *.supabase.co (viz CLAUDE.md, sekce "Síťové omezení"). GitHub Actions
# ale běží s plným internetem a používá stejné SUPABASE_URL/
# SUPABASE_SERVICE_ROLE_KEY secrets jako sync-fixtures/sync-results.
#
# Jen čte (GET), nikam nezapisuje -- POKUD nezadáš `rpc` (viz níže).
# Spouští se ručně (workflow_dispatch).
#
# POZOR: aby šel workflow spustit, musí být tenhle soubor už smergovaný
# v `main` (GitHub jinak workflow_dispatch nenabídne).
#
# Rozšířeno o volání RPC (16.9.2026, stejná konvence jako dřívější
# rozšíření api-probe.yml o POST/tělo/auth hlavičku 5.9.2026) -- appka
# potřebovala vyzkoušet `create_hecovacka()` se service rolí (ta
# obchází RLS), aby se ukázal PŘESNÝ text chyby databáze, ne jen
# obecná hláška appky. Když je vyplněný `rpc`, appka zavolá `POST
# /rest/v1/rpc/{rpc}` s `body` jako JSON tělem místo GETu na `table` --
# `table`/`select`/`query` se v tom případě ignorují. POZOR: na rozdíl
# od GETu tohle může zapisovat data, pokud RPC funkce něco zapisuje
# (accepts service role, obchází RLS) -- používej jen na funkce, kde
# vedlejší efekt buď nevadí, nebo ho po sobě uklidíš.

name: DB probe

on:
  workflow_dispatch:
    inputs:
      table:
        description: "Název tabulky (nebo view) v public schématu -- ignorováno, když je vyplněný `rpc`"
        required: false
        default: ""
        type: string
      select:
        description: "PostgREST select= výraz, čárkou oddělené sloupce (podporuje i vnořené resources, např. 'id,name,matches(home_team)')"
        required: false
        default: "*"
        type: string
      query:
        description: "Zbytek PostgREST query stringu bez úvodního '&', např. 'competition_id=eq.xxx&order=home_team.asc'"
        required: false
        default: ""
        type: string
      rpc:
        description: "Nepovinné: název databázové funkce k zavolání přes POST /rest/v1/rpc/{rpc} (místo GETu na `table`)"
        required: false
        default: ""
        type: string
      body:
        description: "JSON tělo požadavku pro `rpc` (parametry funkce jako JSON objekt)"
        required: false
        default: "{}"
        type: string
      max_chars:
        description: "Kolik znaků odpovědi maximálně vypsat do logu"
        required: false
        default: "40000"
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dotázat se Supabase REST API a vypsat odpověď
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TABLE: ${{ inputs.table }}
          SELECT_EXPR: ${{ inputs.select }}
          EXTRA_QUERY: ${{ inputs.query }}
          RPC_NAME: ${{ inputs.rpc }}
          RPC_BODY: ${{ inputs.body }}
          MAX_CHARS: ${{ inputs.max_chars }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Chybí SUPABASE_URL nebo SUPABASE_SERVICE_ROLE_KEY jako GitHub secret."
            exit 1
          fi

          if [ -n "${RPC_NAME}" ]; then
            URL="${SUPABASE_URL}/rest/v1/rpc/${RPC_NAME}"
            echo "URL: ${URL}"
            echo "Tělo: ${RPC_BODY}"
            echo "----- HTTP status -----"

            HTTP_CODE=$(curl -sS --max-time 30 \
              -X POST \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              --data "${RPC_BODY}" \
              -o body.json \
              -w '%{http_code}' \
              "${URL}") || {
                echo "::error::curl selhal (viz výstup výše)"
                exit 1
              }
          else
            URL="${SUPABASE_URL}/rest/v1/${TABLE}?select=${SELECT_EXPR}"
            if [ -n "${EXTRA_QUERY}" ]; then
              URL="${URL}&${EXTRA_QUERY}"
            fi

            echo "URL: ${URL}"
            echo "----- HTTP status -----"

            HTTP_CODE=$(curl -sS --max-time 30 \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -o body.json \
              -w '%{http_code}' \
              "${URL}") || {
                echo "::error::curl selhal (viz výstup výše)"
                exit 1
              }
          fi

          echo "HTTP kód: ${HTTP_CODE}"

          if jq -e . body.json >/dev/null 2>&1; then
            jq . body.json > pretty.json
            COUNT=$(jq 'if type == "array" then length else 1 end' body.json)
            echo "----- Počet položek: ${COUNT} -----"
            TOTAL=$(wc -c < pretty.json)
            echo "----- Tělo odpovědi (celkem ${TOTAL} znaků, vypisuji max ${MAX_CHARS}) -----"
            head -c "${MAX_CHARS}" pretty.json
            if [ "${TOTAL}" -gt "${MAX_CHARS}" ]; then
              echo
              echo "…(zkráceno — zvyš max_chars, pokud potřebuješ zbytek)"
            fi
          else
            echo "----- Tělo odpovědi (není platný JSON, vypisuji syrově) -----"
            head -c "${MAX_CHARS}" body.json
          fi
          echo
          echo "----- Konec odpovědi -----"
